  - name: csc-dbs-api-getbusinessunitdata
    description: Get business unit data
    arguments:
    - name: filter_
      description: 'Filters can be applied to your request to limit the type of data you receive.  ### Selectors  Selectors can be used to filter by specific properties on the business unit.  - accountName  - accountNumber  - businessUnitName  - usage  ---   ### Search Operators    | Operator | Name                     | |----------|--------------------------| | ==       | Equals                   | | =gt=     | Greater Than             | | =ge=     | Greater Than or Equal to | | =lt=     | Less Than                | | =le=     | Less Than or Equal to    | | =in=     | In a list                | | =like=   | Like query               |   ---  ### Joiners  Joiners can be used to create compound filters.  | Joiner | Name | |--------|------| | ;      | And  | | ,      | Or   |   ---    ### Special Considerations  1. Surround values in double quotes. If the value is a single alphanumeric term, the quotes can be omitted.  2. If a value contains a double quote (") or a backslash (\\), it must be escaped with a backslash.  3. Ampersand and non-ascii characters must be URL encoded.   ---    ### Examples   details   summary Click to view - All examples exclude the required preceding "filter=" /summary  blockquote    details  summary Find all business units with a businessUnitName of TEST BU /summary  blockquote   ``` businessUnitName=="TEST BU" ```   /blockquote   /details    details  summary Find all business units with a businessUnitName like TEST /summary  blockquote   ``` businessUnitName=like="TEST " ```   /blockquote   /details     details  summary Find all business units with a usage of DOMAIN and an accountNumber of 123456 /summary  blockquote   ``` usage=="DOMAIN";accountNumber=="123456" ```   /blockquote   /details     details  summary Find all business units with a usage of DOMAIN or RELATED_SERVICES /summary  blockquote   ``` usage=in=("DOMAIN","RELATED_SERVICES") ```   /blockquote   /details     /blockquote   /details   --- '
      required: false
      isArray: false
    - name: ''
      description: ''
      required: false
      isArray: false
    - name: ''
      description: ''
      required: false
      isArray: false
    - name: ''
      description: ''
      required: false
      isArray: false
    outputs:
