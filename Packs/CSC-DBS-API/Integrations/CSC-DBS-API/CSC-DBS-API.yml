      description: Provide a maximum of 50 fully qualified domain names delimited by a comma (,)
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSC-DBS-API.RegistrationAvailabilityResult.results.qualifiedDomainName
      description: ''
    - type: String
      contextPath: CSC-DBS-API.RegistrationAvailabilityResult.results.result.code
