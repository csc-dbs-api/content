  - name: csc-dbs-api-getdomainconfigurationinformationforowneddomainswithoptionalfiltering
    description: Get domain configuration information for owned domains with optional filtering
    arguments:
    - name: filter_
      description: "Filters can be applied to your request to limit the type of data you receive.  ### Selectors  Selectors can be used to filter by specific properties on the domain.  - domain  - domainLabel  - domainStatusCode  - dnsHostingType  - extension  - tld  - country  - adminEmail  - adminName  - adminOrg  - regEmail  - regName  - regOrg  - techEmail  - techName  - techOrg  - accountNumber  - accountName  - businessUnit  - dnsTraffic12moAve  - hasCscUrlf  - hasDkim  - hasDnssecDs  - hasSpf  - hasWww  - isGtld  - isLive  - isLiveType  - isMultilockEligible  - isVital  - multiLocked  - numLiveMx  - numRootA  - numRootTxt  - numSslNetcraft  - numWwwA  - numWwwCname  - registryExpiryDate  - rootHttpCode  - rootHttpUrl  - rootIsUrlf  - serverDeleteProhibited  - serverTransferProhibited  - serverUpdateProhibited  - urlfTraffic12moAve  - valueRootA  - valueRootMx  - valueRootTxt  - valueWwwA  - valueWwwCname  - wwwHttpCode  - wwwHttpUrl  - wwwIsUrlf  ### Search Operators  | Operator | Name                     | |----------|--------------------------| | ==       | Equals                   | | =gt=     | Greater Than             | | =ge=     | Greater Than or Equal to | | =lt=     | Less Than                | | =le=     | Less Than or Equal to    | | =in=     | In a list                | | =like=   | Like query               |   ---  ### Joiners  Joiners can be used to create compound filters.  | Joiner | Name | |--------|------| | ;      | And  | | ,      | Or   |   ---    ### Special Considerations  1. Surround values in double quotes. If the value is a single alphanumeric term, the quotes can be omitted.  2. If a value contains a double quote (\") or a backslash (\\), it must be escaped with a backslash.  3. Ampersand and non-ascii characters must be URL encoded.  ---    ### Examples   details   summary Click to view - All examples exclude the required preceding \"filter=\" /summary  blockquote    details  summary Find configuration for the domain example.com /summary  blockquote   ``` domain==\"example.com\" ```   /blockquote   /details    details  summary Find all domains with a domainLabel like example /summary  blockquote   ``` domainLabel=like=\"example \" ```   /blockquote   /details     details  summary Find all domains with a registryExpiryDate greater than Jan 05 2020 /summary  blockquote   ``` registryExpiryDate=gt=\"2020-01-05\" ```   /blockquote   /details    details  summary Find all domains with an accountNumber of 1234567 or 0987654 /summary  blockquote   ``` accountNumber=in=(1234567, 0987654) ```   /blockquote   /details     details  summary Find all domains with a valueRootA of 165.160.13.20 or 165.160.15.25 and an extension of 'com' /summary  blockquote   ``` valueRootA=in=(\"165.160.13.20\", \"165.160.15.25\");extension==\"com\" ```   /blockquote   /details     details  summary Find all domains where isVital is true and either multiLocked is false or isMultilockEligible is false /summary  blockquote   ``` isVital==true;multiLocked==false,isMultilockEligible=..."
