    - name: filter_
      description: "Filters can be applied to your request to limit the type of data that you receive. When filter is not given the API will fetch certificates with status (ACTIVE, PENDING, IMPORTED) for the accessible business units.  ### Selectors  Selectors can be used to filter by specific properties on the security event.  - certificateTypeId  - name  - expirationDate  - effectiveDate  - status  - uuid  ---  ### ExpirationDate, EffectiveDate  The 'expirationDate' and the 'effectiveDate' selectors must have the following format: yyyy/MM/dd  ---  ### Search Operators  | Operator | Name                     | |----------|--------------------------| | ==       | Equals                   | | =gt=     | Greater Than             | | =ge=     | Greater Than or Equal to | | =lt=     | Less Than                | | =le=     | Less Than or Equal to    | | =in=     | In a list                | | =like=   | Like Query               |  ---  ### Joiners  Joiners can be used to create compound filters.  | Joiner | Name | |--------|------| | ;      | And  | | ,      | Or   |  ---  ### Special Considerations  1. Surround values in double quotes. If the value is a single alphanumeric term, the quotes can be omitted.  2. If a value contains a double quote (\") or a backslash (\\\\), it must be escaped with a backslash.  3. Ampersand and non-ascii characters must be URL encoded.  ---  ### Examples   details   summary Click to view - All examples exclude the required preceding \"filter=\" /summary  blockquote    details  summary Find all cetificates with status ACTIVE /summary  blockquote   ``` status==ACTIVE ```   /blockquote   /details    details  summary Find all certificates between two dates /summary  blockquote   ``` expirationDate=le=2019/09/25;expirationDate=ge=2019/07/04 ```   /blockquote   /details    details  summary Find all certificate orders that have expiry date after August 25, 2019 /summary  blockquote   ``` expirationDate=gt=2019/08/25;status==ACTIVE ```   /blockquote   /details    /blockquote   /details   --- "
