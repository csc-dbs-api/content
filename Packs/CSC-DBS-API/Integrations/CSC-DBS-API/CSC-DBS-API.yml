      contextPath: CSC-DBS-API.UrlForwardingResult.result.price
      description: price of service
    - type: String
      contextPath: CSC-DBS-API.UrlForwardingResult.result.service
      description: ''
  - name: csc-dbs-api-cancelazoneeditwithafailedstatus
