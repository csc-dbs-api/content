commonfields:
  id: DomainManager API
  version: -1
name: DomainManager API
display: DomainManager API
category: Utilities
description: API Documentation
configuration:
- name: url
  display: Server URL (e.g. https://apis.cscglobal.com/dbs/api/v2)
  defaultvalue: https://apis.cscglobal.com/dbs/api/v2
  type: 0
  required: true
- displaypassword: Token
  additionalinfo: The token to use for connection.
  name: token
  required: true
  hiddenusername: true
  type: 9
- displaypassword: API Key
  additionalinfo: The API Key to use for connection.
  name: api_key
  required: true
  hiddenusername: true
  type: 9
- name: insecure
  display: Trust any certificate (not secure)
  defaultvalue: 'false'
  type: 8
  required: false
- name: proxy
  display: Use system proxy settings
  defaultvalue: 'false'
  type: 8
  required: false
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.8.1983910
  isfetch: false
  commands:
  - name: csc-dbs-api-activateurlforwardingnode
    description: Activate URL forwarding node
    outputs:
