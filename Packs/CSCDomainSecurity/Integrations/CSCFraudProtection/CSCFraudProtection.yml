commonfields:
  id: Anti Fraud API
  version: -1
name: Anti Fraud API
display: Anti Fraud API
category: IT Services
description: This is an anti fraud external api for organizations.
configuration:
- name: url
  display: Server URL
  defaultvalue: https://apis.cscglobal.com/dbs/fraud-protection/v1/fraud-protection-api/external/v3
  type: 0
  required: true
- name: api_key
  display: API Key
  defaultvalue: ''
  type: 4
  required: true
- name: insecure
  display: Trust any certificate (not secure)
  defaultvalue: 'false'
  type: 8
  required: false
- name: proxy
  display: Use system proxy settings
  defaultvalue: 'false'
  type: 8
  required: false
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.8428455
  isfetch: false
  commands:
  - name: cscantifraud-controldetectionflowbyeventidandaction
    description: Control detection flow by event ID and action
    arguments:
    - name: action
      description: Update the action with eventID
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-fetchthedetectiondataandconverttopdf
    description: Fetch the detection data and convert to pdf
    arguments:
    - name: eventId
      description: Event Id to download takedown report
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-fetchthephishkitdatawithticketid
    description: Fetch the phishkit data with ticketId
    arguments:
    - name: ticketId
      description: Ticket Id to fetch phishkit
      required: true
      isArray: false
  - name: cscantifraud-fetchthescreenshotdatawithticketid
    description: Fetch the screenshot data with ticketId
    arguments:
    - name: ticketId
      description: Ticket Id to fetch screenshot
      required: true
      isArray: false
  - name: cscantifraud-fetchtheticketdataandconverttopdf
    description: Fetch the ticket data and convert to pdf
    arguments:
    - name: ticketId
      description: Ticket Id to fetch supporting documents for takedown
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-gethtmlsourcecodeforaticket
    description: Get HTML Source Code for a Ticket
    arguments:
    - name: ticketId
      description: Ticket ID to fetch HTML source
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-getlistofbrands
    description: Get list of Brands
    outputs:
    - type: Number
      contextPath: CSCFraudProtection.brandId
      description: ''
    - type: String
      contextPath: CSCFraudProtection.brandName
      description: ''
    - type: Boolean
      contextPath: CSCFraudProtection.isActive
      description: ''
  - name: cscantifraud-getlistoffraudtypes
    description: Get list of fraud types
    outputs:
    - type: Number
      contextPath: CSCFraudProtection.fraudTypeId
      description: ''
    - type: String
      contextPath: CSCFraudProtection.fraudTypeName
      description: ''
  - name: cscantifraud-listofworklogsforticketid
    description: List of work logs for ticket id
    arguments:
    - name: ticketId
      description: Ticket ID to fetch work log details
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-listtakedownevents
    description: List Takedown Events
    arguments:
    - name: fromDate
      description: Start date in YYYY-MM-DD format
      required: true
      isArray: false
    - name: toDate
      description: End date in YYYY--MM--DD format
      required: true
      isArray: false
    - name: page
      description: page size
      required: false
      isArray: false
    - name: limit
      description: Limit between 100 and 500, default = 100
      required: false
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-listtakedowneventswithfilters
    description: List Takedown events with filters
    arguments:
    - name: fromDate
      description: Start date in YYYY-MM-DD format
      required: true
      isArray: false
    - name: toDate
      description: End date in YYYY--MM--DD format
      required: true
      isArray: false
    - name: _andId
      description: Filter by Brand Id
      required: false
      isArray: false
    - name: fraudType
      description: Type of the Fraud
      required: false
      isArray: false
    - name: ticketStatus
      description: Ticket Status
      required: false
      isArray: false
    - name: DetectionDate
      description: Filter by Detection date
      required: false
      isArray: false
    - name: AuthorizationDate
      description: Filter by Authorization date
      required: false
      isArray: false
    - name: CompletedDate
      description: Filter by Closed date
      required: false
      isArray: false
    - name: page
      description: page size
      required: false
      isArray: false
    - name: limit
      description: Limit between 100 and 500, default = 100
      required: false
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-performanactiononasingletarget
    description: Perform an action on a single target
    arguments:
    - name: targetType
      description: Type of the target (URL, PHONE, EMAIL)
      required: false
      isArray: false
    - name: action
      description: Ticket action
      required: true
      isArray: false
    - name: fraudType
      description: Type of the Fraud
      required: false
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-retrieveeventscreenshotwitheventid
    description: Retrieve event screenshot with eventId
    arguments:
    - name: eventId
      description: Event Id to fetch screenshot details
      required: true
      isArray: false
  - name: cscantifraud-retrievefilteredlistofmonitoringresultswithinspecifiedtimeframe
    description: Retrieve filtered list of monitoring results within specified timeframe
    arguments:
    - name: startDate
      description: 'Filter by from date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: endDate
      description: 'Filter by end date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: _andId
      description: Filter by Brand Id
      required: false
      isArray: false
    - name: fraudType
      description: Type of the Fraud
      required: false
      isArray: false
    - name: monitoringStatus
      description: Monitoring Status
      required: false
      isArray: false
    - name: page
      description: page size
      required: false
      isArray: false
    - name: limit
      description: Limit between 100 and 500, default is 100
      required: false
      isArray: false
  - name: cscantifraud-retrievelistofdetectionswithinspecifiedtimeframe
    description: Retrieve list of detections within specified timeframe
    arguments:
    - name: fromDate
      description: 'Filter by from date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: toDate
      description: 'Filter by to date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: scoreMin
      description: Filter by score
      required: false
      isArray: false
    - name: ip
      description: Filter by ip
      required: false
      isArray: false
    - name: isp
      description: Filter by isp
      required: false
      isArray: false
    - name: registrar
      description: Filter by registrar
      required: false
      isArray: false
    - name: monitoring
      description: Filter by monitoring
      required: false
      isArray: false
    - name: page
      description: page size
      required: false
      isArray: false
    - name: limit
      description: Limit between 100 and 500, default is 100
      required: false
      isArray: false
  - name: cscantifraud-retrievelistofmonitoringresultswithinspecifiedtimeframe
    description: Retrieve list of monitoring results within specified timeframe
    arguments:
    - name: startDate
      description: 'Filter by from date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: endDate
      description: 'Filter by end date. Expected format: YYYY-MM-DD'
      required: true
      isArray: false
    - name: page
      description: page size
      required: false
      isArray: false
    - name: limit
      description: Limit between 100 and 500, default is 100
      required: false
      isArray: false
  - name: cscantifraud-retrievephishkitwitheventid
    description: Retrieve phishkit with eventId
    arguments:
    - name: eventId
      description: Event Id to fetch phishkit details
      required: true
      isArray: false
  - name: cscantifraud-startorstopmonitoringforaspecificevent
    description: Start or stop monitoring for a specific event
    arguments:
    - name: action
      description: Monitoring action to perform
      required: true
      isArray: false
    outputs:
    - type: String
      contextPath: CSCFraudProtection.message
      description: ''
    - type: String
      contextPath: CSCFraudProtection.status
      description: ''
  - name: cscantifraud-updatetheactionwithticketid
    description: Update the action with ticketId
    arguments:
    - name: action
      description: Ticket action
      required: true
      isArray: false
